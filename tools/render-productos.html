<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DropScents — render de fichas de producto</title>
<style>
  body { margin: 0; background: #eee; font: 14px system-ui; }
  #out { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
  #out img { width: 100%; background:
    repeating-conic-gradient(#fff 0 25%, #e6e6e6 0 50%) 0 0 / 20px 20px; }
</style>
</head>
<body>
<!--
  HERRAMIENTA DE DESARROLLO — no forma parte del sitio.

  Genera una ficha (frasco + caja) por fragancia usando la MISMA geometría del
  hero, con la receta de color de cada una en src/data.js → `render`.
  Son ilustraciones originales: sirven de marcador de posición hasta que haya
  fotos reales del producto, y no dependen de imágenes de terceros.

  Uso:  npm run dev  →  http://localhost:5173/tools/render-productos.html
        window.__shots queda con los dataURL (los recoge un script externo).
-->
<div id="out"></div>

<script type="module">
import * as THREE from 'three';
import { flaconShape, roundedRect, flute, brandEnvTexture, addFillAttribute } from '../src/scene.js';
import { FRAGANCIAS } from '../src/data.js';

const W = 1000, H = 800;

const canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = brandEnvTexture();
const env = pmrem.fromEquirectangular(envTex).texture;
envTex.dispose(); pmrem.dispose();

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 60);
camera.position.set(0.55, 0.55, 8.2);
camera.lookAt(0, -0.05, 0);

/** una ficha: caja detrás a la izquierda, frasco delante a la derecha */
function ficha(r) {
  const scene = new THREE.Scene();
  scene.environment = env;

  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(-3, 4.5, 4.5); scene.add(key);
  const rim = new THREE.PointLight(0xffd2e2, 10, 20, 2);
  rim.position.set(3.6, -1, 3); scene.add(rim);
  const fill = new THREE.PointLight(0xc8dcff, 9, 18, 2);
  fill.position.set(-3, 1.4, -2); scene.add(fill);

  const g = new THREE.Group();
  scene.add(g);

  /* ---- caja ---- */
  const bw = r.w * 1.02, bh = r.h * 1.16, bd = 0.62;
  const boxGeo = new THREE.BoxGeometry(bw, bh, bd);
  const box = new THREE.Mesh(boxGeo, new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(r.box), roughness: 0.62, metalness: 0.05,
    clearcoat: 0.25, envMapIntensity: 0.8,
  }));
  box.position.set(-r.w * 0.62, bh / 2 - r.h / 2 - 0.05, -0.75);
  box.rotation.y = 0.34;
  g.add(box);

  // banda de la caja: sin logos, sólo el gesto gráfico del empaque
  const banda = new THREE.Mesh(
    new THREE.PlaneGeometry(bw * 0.99, bh * 0.1),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(r.banda), transparent: true, opacity: 0.85 })
  );
  banda.position.set(0, bh * 0.1, bd / 2 + 0.002);
  box.add(banda);

  /* ---- frasco ---- */
  const glass = new THREE.MeshPhysicalMaterial({
    color: 0xefe9f6, metalness: 0, roughness: 0.03,
    clearcoat: 1, clearcoatRoughness: 0.03, iridescence: 0.45,
    envMapIntensity: 2.4, reflectivity: 0.7,
    sheen: 0.45, sheenColor: new THREE.Color(0xffffff), sheenRoughness: 0.35,
    transparent: true, opacity: 0.42, depthWrite: false,
  });
  glass.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace(
      '#include <opaque_fragment>',
      `float fres = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 2.2);
       diffuseColor.a = mix(diffuseColor.a * 0.34, 1.0, fres);
       #include <opaque_fragment>`
    );
  };
  const glassBack = glass.clone();
  glassBack.side = THREE.BackSide; glassBack.opacity = 0.24;

  const bottle = new THREE.Group();
  bottle.position.set(r.w * 0.5, -r.h / 2 - 0.05 + r.h / 2, 0.3);
  bottle.rotation.y = -0.22;
  g.add(bottle);

  const bodyGeo = new THREE.ExtrudeGeometry(flaconShape(r.w, r.h, 0.13, r.sh), {
    depth: 0.58, bevelEnabled: true, bevelThickness: 0.075,
    bevelSize: 0.075, bevelSegments: 4, curveSegments: 22,
  });
  bodyGeo.translate(0, 0, -0.29);
  bodyGeo.computeVertexNormals();
  const back = new THREE.Mesh(bodyGeo, glassBack); back.renderOrder = 0;
  const front = new THREE.Mesh(bodyGeo, glass); front.renderOrder = 3;
  bottle.add(back, front);

  // jugo: superficie plana, sin invadir el hombro
  const juiceMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.16, clearcoat: 0.3, clearcoatRoughness: 0.3,
    envMapIntensity: 1.1, transparent: true, opacity: 0.92, depthWrite: false,
  });
  const c = new THREE.Color(r.juice);
  const top = c.clone().lerp(new THREE.Color(0xffffff), 0.32).convertSRGBToLinear();
  const bot = c.clone().lerp(new THREE.Color(0x000000), 0.45).convertSRGBToLinear();
  juiceMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTop = { value: top };
    sh.uniforms.uBot = { value: bot };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aFill;\nvarying float vFill;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFill = aFill;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vFill;\nuniform vec3 uTop;\nuniform vec3 uBot;')
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(uBot, uTop, clamp(vFill, 0.0, 1.0));');
  };
  const jh = r.h - 0.16;
  const juiceGeo = new THREE.ExtrudeGeometry(roundedRect(r.w - 0.16, jh, 0.09), {
    depth: 0.42, bevelEnabled: true, bevelThickness: 0.035,
    bevelSize: 0.035, bevelSegments: 3, curveSegments: 18,
  });
  juiceGeo.translate(0, jh / 2, -0.21);
  addFillAttribute(juiceGeo);
  const juice = new THREE.Mesh(juiceGeo, juiceMat);
  juice.position.y = -jh / 2;
  juice.scale.y = Math.min(0.8, 1 - r.sh / r.h);
  juice.renderOrder = 1;
  bottle.add(juice);

  const capMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(r.cap), metalness: 0.55, roughness: 0.32,
    clearcoat: 0.8, clearcoatRoughness: 0.25, envMapIntensity: 1.3,
  });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(r.capR * 0.5, r.capR * 0.58, 0.22, 26), glass);
  neck.position.y = r.h / 2 + 0.07; neck.renderOrder = 3;
  bottle.add(neck);

  const capGeo = new THREE.CylinderGeometry(r.capR, r.capR * 0.98, 0.4, 56, 1);
  flute(capGeo, 18, 0.018);
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = r.h / 2 + 0.15;
  bottle.add(cap);

  // Encuadre: se mide SOLO caja + frasco. Si la sombra entra en el bounding
  // box, infla el tamaño y la ficha sale diminuta dentro del lienzo.
  const bbox = new THREE.Box3().setFromObject(box).union(new THREE.Box3().setFromObject(bottle));
  const size = bbox.getSize(new THREE.Vector3());
  const center = bbox.getCenter(new THREE.Vector3());
  const k = Math.min(4.6 / size.x, 3.4 / size.y);
  g.scale.setScalar(k);
  g.position.sub(center.multiplyScalar(k));

  /* ---- sombra de contacto (se añade después del encuadre) ---- */
  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const sg = sc.getContext('2d');
  const rg = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, 'rgba(43,15,51,.34)');
  rg.addColorStop(0.5, 'rgba(43,15,51,.12)');
  rg.addColorStop(1, 'rgba(43,15,51,0)');
  sg.fillStyle = rg; sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(4.6, 3),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(-0.1, -r.h / 2 - 0.07, 0.1);
  shadow.renderOrder = -1;
  g.add(shadow);

  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
}

const out = document.getElementById('out');
window.__shots = FRAGANCIAS.map((f) => {
  const url = ficha(f.render);
  const img = new Image();
  img.src = url;
  img.title = f.nombre;
  out.appendChild(img);
  return { id: f.id, url };
});
window.__listo = true;
</script>
</body>
</html>
